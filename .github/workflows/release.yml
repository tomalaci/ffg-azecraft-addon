name: Release Module

# Publishing a GitHub release (tag e.g. 0.4.0) builds the Foundry manifest and module.zip for that
# tag and attaches them to the release. Foundry installs from
# releases/latest/download/module.json.
on:
  release:
    types: [ published ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build release manifest
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repository = os.environ["REPOSITORY"]

          manifest_path = Path("module.json")
          release_manifest_path = Path("dist") / "module.json"
          release_manifest_path.parent.mkdir(parents=True, exist_ok=True)

          with manifest_path.open("r", encoding="utf-8") as handle:
              manifest = json.load(handle)

          manifest["version"] = version
          manifest["url"] = f"https://github.com/{repository}"
          manifest["manifest"] = f"https://github.com/{repository}/releases/latest/download/module.json"
          manifest["download"] = f"https://github.com/{repository}/releases/download/{tag}/module.zip"

          with release_manifest_path.open("w", encoding="utf-8", newline="\n") as handle:
              json.dump(manifest, handle, indent=4)
              handle.write("\n")
          PY

      - name: Build module archive
        run: |
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --exclude "dist" \
            --exclude "AGENTS.md" \
            --exclude ".ai" \
            --exclude "tests" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "eslint.config.js" \
            --exclude "node_modules" \
            --exclude "compose.yml"
          cp dist/module.json dist/package/module.json
          cd dist/package
          zip -r -X ../module.zip .
          cd ..
          unzip -l module.zip | tail -n 1

      # The GitHub CLI is preinstalled on the runner (no third-party action needed).
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/module.json dist/module.zip --clobber --repo "$REPOSITORY"
