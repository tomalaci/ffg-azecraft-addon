name: Check

# Lint, syntax checks and unit tests (.ai/check) on every push to main and on pull requests.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Run checks
        run: .ai/check
