services:
  foundry:
    image: ghcr.io/felddy/foundryvtt:13.351
    hostname: ffg-azecraft-foundry
    init: true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        export FOUNDRY_LICENSE_KEY="$$(cat /run/secrets/foundry_license_key)"
        mkdir -p /data/container_cache /data/Data/modules
        test -s /data/container_cache/foundryvtt-13.351.zip || cp /foundryvtt-13.351.zip /data/container_cache/foundryvtt-13.351.zip
        if [ -L /data/modules/ffg-azecraft-addon ]; then rm /data/modules/ffg-azecraft-addon; fi
        rmdir /data/modules 2>/dev/null || true
        if [ -e /data/Data/modules/ffg-azecraft-addon ] && [ ! -L /data/Data/modules/ffg-azecraft-addon ]; then
          echo "Refusing to replace non-symlink module directory: /data/Data/modules/ffg-azecraft-addon" >&2
          exit 1
        fi
        ln -sfn /module-src /data/Data/modules/ffg-azecraft-addon
        exec ./entrypoint.sh resources/app/main.mjs --port=30000 --headless --noupdate --dataPath=/data
    environment:
      CONTAINER_PRESERVE_CONFIG: "true"
      FOUNDRY_HOT_RELOAD: "true"
      FOUNDRY_TELEMETRY: "false"
      FOUNDRY_UPNP: "false"
      FOUNDRY_VERSION: "13.351"
      TZ: Europe/Stockholm
    ports:
      - "30000:30000"
    volumes:
      - type: bind
        source: ${HOME}/.local/share/foundry-vtt/Data
        target: /data
      - type: bind
        source: ${HOME}/.local/share/foundry-vtt/Dist/FoundryVTT-Node-13.351.zip
        target: /foundryvtt-13.351.zip
        read_only: true
      - type: bind
        source: .
        target: /module-src
        read_only: true
    secrets:
      - foundry_license_key

secrets:
  foundry_license_key:
    file: ${HOME}/.local/share/foundry-vtt/license.txt
